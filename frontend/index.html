<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CivicRoute AI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>CivicRoute AI</h1>
    </div>
    <p class="tagline">Report a civic issue &mdash; it gets classified and routed automatically.</p>
  </header>

  <div class="grid">
    <section class="card form-card">
      <h2>File a report</h2>
      <label>Your name
        <input id="name" type="text" placeholder="e.g. Harshitha" />
      </label>
      <label>Ward / zone
        <input id="zone" type="text" placeholder="e.g. Zone 4" />
      </label>
      <label>What's the issue?
        <textarea id="issue" rows="3" placeholder="e.g. streetlight not working near the park"></textarea>
      </label>
      <div class="actions">
        <button id="submitBtn" class="primary">File report</button>
        <button id="resetBtn" class="ghost">Reset officers</button>
      </div>
      <p id="statusMsg" class="status"></p>
    </section>

    <section class="card result-card" id="resultCard" hidden>
      <h2>Ticket</h2>
      <div id="resultBody"></div>
    </section>
  </div>

  <section class="card officers-card">
    <h2>Field officers on duty</h2>
    <div id="officersGrid" class="officers-grid"></div>
  </section>

  <footer>
    <p>Built with LangGraph + Gemini &middot; SDG 11: Sustainable Cities and Communities</p>
  </footer>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
